services:
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: campus1234
      MYSQL_DATABASE: campus
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus1234
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: campus-redis
    command: redis-server --requirepass campus1234
    ports:
      - "6379:6379"
