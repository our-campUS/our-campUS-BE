spring:
  application:
    name: campus-be
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: illta.campus
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

oauth:
  kakao:
    client-id: ${REST_API_KEY}
    client-secret: ${CLIENT_SECRET}
    redirect-uri: "http://localhost:8080/auth/login/kakao"
    admin-key: ${ADMIN_KEY}

jwt:
  access:
    secret: ${JWT_ACCESS}
    expiration-seconds: 3600
  refresh:
    secret: ${JWT_SECRET}
    expiration-seconds: 1209600
oci:
  tenancy-ocid: ${OCI_TENANCY_OCID}
  user-ocid: ${OCI_USER_OCID}
  fingerprint: ${OCI_FINGERPRINT}
  private-key: ${OCI_PRIVATE_KEY}
  passphrase: ${OCI_PASSPHRASE:}
  namespace: ${OCI_NAMESPACE}
  bucket-name: ${BUCKET_NAME}
  region: ${OCI_REGION}

map:
  naver:
    client-id: ${MAP_CLIENT_ID}
    client-secret: ${MAP_CLIENT_SECRET}
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY}
  geocoder:
    api-key: ${GEOCODER_API_KEY}

server-uri: http://localhost:8080

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH}