spring:
  application:
    name: campus-be
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: illta.campus
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

oauth:
  kakao:
    client-id: ${REST_API_KEY}
    client-secret: ${CLIENT_SECRET}
    redirect-uri: "http://localhost:8080/auth/login/kakao"
    admin-key: ${ADMIN_KEY}

jwt:
  access:
    secret: ${JWT_ACCESS}
    expiration-seconds: 3600
  refresh:
    secret: ${JWT_SECRET}
    expiration-seconds: 1209600

server-uri: http://localhost:8080